<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Cart Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
        }

        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
        }

        .cart-summary {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
    </style>

</head>

<body>

    <div class="container mt-5">

        <h3 class="mb-4">🛒 Your Cart</h3>

        <div class="row">

            ```
            <!-- CART ITEMS -->
            <div class="col-md-8">

                <!-- Item 1 -->
                <div class="card mb-3 p-3 cart-item">
                    <div class="row align-items-center">
                        <div class="col-md-2">
                            <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8">
                        </div>

                        <div class="col-md-4">
                            <h5>Laptop</h5>
                            <p class="text-muted">High performance laptop</p>
                        </div>

                        <div class="col-md-2">
                            <input type="number" value="1" min="1" class="form-control">
                        </div>

                        <div class="col-md-2">
                            <p class="fw-bold text-success">₹50,000</p>
                        </div>

                        <div class="col-md-2 text-end">
                            <button class="btn btn-danger btn-sm">Remove</button>
                        </div>
                    </div>
                </div>

                <!-- Item 2 -->
                <div class="card mb-3 p-3 cart-item">
                    <div class="row align-items-center">
                        <div class="col-md-2">
                            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9">
                        </div>

                        <div class="col-md-4">
                            <h5>Smartphone</h5>
                            <p class="text-muted">Latest Android phone</p>
                        </div>

                        <div class="col-md-2">
                            <input type="number" value="2" min="1" class="form-control">
                        </div>

                        <div class="col-md-2">
                            <p class="fw-bold text-success">₹20,000</p>
                        </div>

                        <div class="col-md-2 text-end">
                            <button class="btn btn-danger btn-sm">Remove</button>
                        </div>
                    </div>
                </div>

            </div>

            <!-- SUMMARY -->
            <div class="col-md-4">

                <div class="cart-summary shadow">

                    <h5>Order Summary</h5>
                    <hr>

                    <p>Items: <span class="float-end">3</span></p>
                    <p>Total: <span class="float-end">₹90,000</span></p>

                    <hr>

                    <button class="btn btn-success w-100 mb-2">
                        Proceed to Checkout
                    </button>

                    <button class="btn btn-outline-secondary w-100">
                        Continue Shopping
                    </button>

                </div>

            </div>
            ```

        </div>

    </div>

</body>

</html>
