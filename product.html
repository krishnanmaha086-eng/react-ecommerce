<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Detail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }

    .product-img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 10px;
    }

    .price {
      font-size: 28px;
      color: #198754;
      font-weight: bold;
    }

    .old-price {
      text-decoration: line-through;
      color: gray;
      margin-left: 10px;
    }

    .rating {
      color: orange;
    }
  </style>

</head>

<body>

<div class="container mt-5">
  <div class="row align-items-start">

    <!-- LEFT IMAGE -->
    <div class="col-md-6">
      <img src="https://images.pexels.com/photos/18105/pexels-photo.jpg"
           class="img-fluid rounded shadow">
    </div>

    <!-- RIGHT CONTENT -->
    <div class="col-md-6">

      <h2 class="fw-bold">Laptop</h2>

      <!-- Rating -->
      <div class="text-warning mb-2">
        ★★★★☆ (120 reviews)
      </div>

      <!-- Price -->
      <div class="mb-3">
        <span class="fs-3 fw-bold text-success">₹50,000</span>
        <span class="text-muted text-decoration-line-through ms-2">₹60,000</span>
      </div>

      <!-- Description -->
      <p>
        Powerful laptop with 16GB RAM, 512GB SSD, and latest processor.
        Perfect for work, gaming, and multitasking.
      </p>

      <!-- Quantity -->
      <div class="mb-3">
        <label class="fw-bold">Quantity:</label>
        <input type="number" value="1" min="1" class="form-control w-25">
      </div>

      <!-- Buttons -->
      <div class="d-flex">
        <button class="btn btn-success me-2">Add to Cart</button>
        <button class="btn btn-primary">Buy Now</button>
      </div>

    </div>

  </div>
</div>

</body>
</html>
